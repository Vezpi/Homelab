services:
  network_application:
    image: lscr.io/linuxserver/unifi-network-application:10.6.101-ls143
    container_name: unifi_network_application
    depends_on:
      - db
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASS=${MONGO_PASS}
      - MONGO_HOST=unifi_db
      - MONGO_PORT=27017
      - MONGO_DBNAME=${MONGO_DBNAME}
      - MONGO_AUTHSOURCE=${MONGO_AUTHSOURCE}
      #- MEM_LIMIT=1024 #optional
      #- MEM_STARTUP=1024 #optional
      #- MONGO_TLS= #optional
    volumes:
      - /appli/data/unifi/config:/config
    ports:
      #- 443:443
      - 3478:3478/udp
      - 10001:10001/udp
      - 8080:8080
      - 1900:1900/udp #optional
      - 8843:8843 #optional
      - 8880:8880 #optional
      - 6789:6789 #optional
      - 5514:5514/udp #optional
    networks:
      - unifi
      - web
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.unifi.rule=Host(`${URL}`)
      - traefik.http.routers.unifi.entrypoints=https
      - traefik.http.routers.unifi.tls.certresolver=letsencrypt
      - traefik.http.services.unifi.loadbalancer.server.port=8443
      - traefik.http.services.unifi.loadbalancer.server.scheme=https
      - traefik.http.services.unifi.loadbalancer.serversTransport=insecure@file
    restart: unless-stopped

  db:
    image: docker.io/mongo:8.0
    container_name: unifi_db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASS=${MONGO_PASS}
      - MONGO_DBNAME=${MONGO_DBNAME}
      - MONGO_AUTHSOURCE=${MONGO_AUTHSOURCE}
    volumes:
      - /appli/data/unifi/data:/data/db
      - /appli/docker/unifi/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    networks: 
      - backend
    restart: unless-stopped

networks:
  backend:
  unifi:
    external: true
  web:
    external: true
