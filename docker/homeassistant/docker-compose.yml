  #   environment:
  #     - TZ=Europe/Paris
  #   volumes:
  #     - /appli/data/homeassistant/ollama/data:/root/.ollama
  #   networks:
  #     - backend
  #   restart: unless-stopped

networks:
  backend:
  lan:
    external: true
  web:
    external: true
